name: wipe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete every file
        run: |
          set -euo pipefail
          git config user.name ge0r9b
          git config user.email ge0r9b@users.noreply.github.com
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git add -A
          git commit -m "Remove damaged build 202610162270"
          git push
