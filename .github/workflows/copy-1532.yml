name: copy-1532
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy Grok Bot build 202610151532
        run: |
          set -euo pipefail
          SHA=4e526d26df11fc95686ab3f5f8710aa48fd6b782
          rm -rf /tmp/src
          git clone --filter=blob:none --no-checkout https://github.com/ge0r9b/us-districts.git /tmp/src
          git -C /tmp/src checkout "$SHA"
          test "$(git -C /tmp/src rev-parse HEAD)" = "$SHA"
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/src/v2 /tmp/src/lib /tmp/src/data "$GITHUB_WORKSPACE/"
          cp -a /tmp/src/.nojekyll /tmp/src/HANDOFF.md "$GITHUB_WORKSPACE/"
          grep -q 'BUILD="202610151532"' v2/index.html
          git config user.name ge0r9b
          git config user.email ge0r9b@users.noreply.github.com
          git add -A
          git commit -m "Copy Grok Bot build 202610151532 from us-districts"
          git push
